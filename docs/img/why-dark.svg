        <rect class="bar" x="210" y="82" width="100" height="4" rx="2"/>
        <rect class="btn" x="210" y="96" width="56" height="18" rx="3"/>
        <text class="btn-t" x="238" y="108" style="font-size:9px">Contact us</text>
        <rect class="bar" x="210" y="128" width="40" height="36" rx="3"/>
        <rect class="bar" x="254" y="128" width="40" height="36" rx="3"/>
        <rect class="bar" x="298" y="128" width="40" height="36" rx="3"/>
        <circle class="ink" cx="228" cy="140" r="4"/><path class="ink" d="M220 164v-8a8 8 0 0 1 16 0v8Z"/><rect class="ink" x="234" y="137" width="3.5" height="7" rx="1"/>
        <circle class="ink" cx="272" cy="140" r="4"/><path class="ink" d="M264 164v-8a8 8 0 0 1 16 0v8Z"/><rect class="ink" x="278" y="137" width="3.5" height="7" rx="1"/>
        <path class="ink" d="M302 164L313 147L320 156L326 150L334 164Z"/>
        <path class="lane" d="M151 176H349V202a7 7 0 0 1-7 7H158a7 7 0 0 1-7-7Z"/>
        <line class="rule" x1="150" y1="176" x2="350" y2="176"/>

        <path class="lead" d="M343 37L360 42"/>
        <text class="q i" x="364" y="38">“that menu in the corner,</text>
        <text class="q i" x="364" y="54">I mean the burger”</text>
        <path class="lead" d="M268 105H358"/>
        <text class="q i" x="364" y="102">“the call to action in red</text>
        <text class="q i" x="364" y="118">that says ‘Contact us’”</text>
        <path class="lead" d="M274 165V170H358"/>
        <text class="q i" x="364" y="166">“the photo with the guy</text>
        <text class="q i" x="364" y="182">on the phone, but not</text>
        <text class="q i" x="364" y="198">the first one”</text>
      </g><text x="690" y="22" style="font-size:12px;letter-spacing:.08em;font-weight:700" class="acc">POINTING AT IT</text><text class="small" x="690" y="40" style="font-size:12px">It does not matter what it is called.</text><g transform="translate(540 50)">
        <rect class="card" x="150" y="20" width="200" height="190" rx="8"/>
        <line class="rule" x1="150" y1="44" x2="350" y2="44"/>
