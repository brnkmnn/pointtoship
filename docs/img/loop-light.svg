<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 880 450" role="img" aria-label="The loop in eight steps: point and comment, an issue opens, the runner starts an agent, the agent follows the method, commits, the runner checks and pushes, the host deploys, status and Show come back to the page."><style>.dg text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #16181c; }
.dg .lane { fill: #e8eae5; }
.dg .card { fill: #fbfbf9; stroke: #d6d9d3; stroke-width: 1; }
.dg .rule { stroke: #d6d9d3; stroke-width: 1; fill: none; }
.dg .bar { fill: #d6d9d3; }
.dg .ink { fill: #5d636b; opacity: .5; }
.dg .stroke-ink { stroke: #5d636b; stroke-width: 2; stroke-linecap: round; fill: none; }
.dg .btn { fill: #b5452c; }
.dg .sel { fill: rgba(47, 91, 255, .08); stroke: #2f5bff; stroke-width: 2; }
.dg .bubble { fill: #fbfbf9; stroke: #2f5bff; stroke-width: 1.5; }
.dg .pill { fill: #f3f4f1; stroke: #d6d9d3; stroke-width: 1; }
.dg .acc-line { stroke: #2f5bff; stroke-width: 1.5; fill: none; }
.dg .acc-dash { stroke: #2f5bff; stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
.dg .cursor { fill: #16181c; stroke: #fbfbf9; stroke-width: 1; }
.dg .badge { fill: #2f5bff; }
.dg .arrow { stroke: #5d636b; stroke-width: 1.5; fill: none; }
.dg .arrow.dash { stroke-dasharray: 4 4; }
.dg .ah { fill: #5d636b; }
.dg .lead { stroke: #5d636b; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
.dg text.lbl { font-size: 10.5px; letter-spacing: .08em; fill: #5d636b; }
.dg text.name { font-size: 14px; font-weight: 700; }
.dg text.cap { font-size: 12.5px; text-anchor: middle; }
.dg text.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
.dg text.note { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 11.5px; }
.dg text.small { font-size: 10.5px; fill: #5d636b; }
.dg text.s11 { font-size: 11px; }
.dg text.s115 { font-size: 11.5px; }
.dg text.btn-t { fill: #fbfbf9; font-size: 10px; text-anchor: middle; }
.dg text.badge-t { fill: #fbfbf9; font-size: 11px; font-weight: 700; text-anchor: middle; }
.dg text.alabel { font-size: 11px; fill: #5d636b; text-anchor: middle; paint-order: stroke; stroke: #f3f4f1; stroke-width: 5px; stroke-linejoin: round; }
.dg text.alabel.start { text-anchor: start; }
.dg text.q { font-size: 13px; fill: #5d636b; }
.dg text.q.end { text-anchor: end; }
.dg text.q.i { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
.dg text.qm { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #5d636b; text-anchor: end; }
.dg text.say { font-size: 13px; }
.dg .m { fill: #5d636b; }
.dg .ok { fill: #2f7a4a; }
.dg .warn { fill: #b5452c; }
.dg .acc { fill: #2f5bff; }
.dg .b { font-weight: 700; }</style>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>

      <rect class="lane" x="10" y="0" width="200" height="450" rx="10"/>
      <rect class="lane" x="230" y="0" width="200" height="450" rx="10"/>
      <rect class="lane" x="450" y="0" width="200" height="450" rx="10"/>
      <rect class="lane" x="670" y="0" width="200" height="450" rx="10"/>
      <text class="lbl" x="35" y="24">ON THE SITE</text><text class="name" x="35" y="44">One script tag</text>
      <text class="lbl" x="255" y="24">THE QUEUE</text><text class="name" x="255" y="44">Your tracker</text>
      <text class="lbl" x="475" y="24">THE RUNNER</text><text class="name" x="475" y="44">Whatever watches it</text>
      <text class="lbl" x="695" y="24">THE METHOD</text><text class="name" x="695" y="44">An Agent Skill</text>

      <!-- 1 Point -->
      <rect class="card" x="35" y="64" width="150" height="130" rx="6"/>
      <line class="rule" x1="35" y1="80" x2="185" y2="80"/>
      <circle class="bar" cx="55" cy="72" r="2.2"/><circle class="bar" cx="62" cy="72" r="2.2"/><circle class="bar" cx="69" cy="72" r="2.2"/>
      <rect class="ink" x="47" y="90" width="80" height="8" rx="2"/>
      <rect class="bar" x="47" y="104" width="126" height="4" rx="2"/>
      <rect class="bar" x="47" y="112" width="100" height="4" rx="2"/>
      <rect class="sel" x="43" y="122" width="84" height="26" rx="4"/>
      <rect class="btn" x="47" y="126" width="76" height="18" rx="3"/>
      <text class="btn-t" x="85" y="139">Contact us</text>
      <polygon class="badge" points="100,153 110,153 98,146"/>
      <rect class="bubble" x="88" y="153" width="92" height="35" rx="5"/>
      <text class="s11" x="96" y="167">Change text to</text>
      <text class="s11" x="96" y="181">“Book now”</text>
      <text class="cap" x="110" y="216">You point and say</text>
      <text class="cap" x="110" y="231">what should change</text>

      <!-- 2 Issue -->
      <rect class="card" x="255" y="64" width="150" height="130" rx="6"/>
      <text class="s11" x="267" y="84"><tspan class="acc b">#12</tspan> Change text to</text>
      <text class="s11" x="267" y="98">“Book now”</text>
      <line class="rule" x1="267" y1="106" x2="393" y2="106"/>
      <text class="mono" x="267" y="122"><tspan class="m">text</tspan><tspan x="303">Contact us</tspan></text>
      <text class="mono" x="267" y="137"><tspan class="m">near</tspan><tspan x="303">Pricing</tspan></text>
      <text class="mono" x="267" y="152"><tspan class="m">page</tspan><tspan x="303">/pricing</tspan></text>
      <text class="mono" x="267" y="167"><tspan class="m">view</tspan><tspan x="303">1512×857</tspan></text>
      <text class="small" x="267" y="184">opened by your site</text>
      <text class="cap" x="330" y="216">An issue holds the</text>
      <text class="cap" x="330" y="231">comment and pointer</text>

      <!-- 3 Runner -->
      <rect class="card" x="475" y="64" width="150" height="130" rx="6"/>
      <text class="small" x="487" y="86">CI or your computer</text>
      <line class="rule" x1="487" y1="96" x2="613" y2="96"/>
      <circle class="ok" cx="492" cy="112" r="3.5"/><text class="mono" x="502" y="116">issue #12</text>
      <circle class="ok" cx="492" cy="132" r="3.5"/><text class="mono" x="502" y="136">author ok</text>
      <circle class="ok" cx="492" cy="152" r="3.5"/><text class="mono" x="502" y="156">fresh sandbox</text>
      <circle class="acc" cx="492" cy="172" r="3.5"/><text class="mono" x="502" y="176">agent started</text>
      <text class="cap" x="550" y="216">The runner checks</text>
      <text class="cap" x="550" y="231">and starts an agent</text>

      <!-- 4 Method -->
      <path class="card" d="M701 64H825L845 84V188a6 6 0 0 1-6 6H701a6 6 0 0 1-6-6V70a6 6 0 0 1 6-6Z"/>
      <path class="rule" d="M825 64V84H845"/>
      <text class="mono b" x="707" y="86">SKILL.md</text>
      <line class="rule" x1="707" y1="96" x2="833" y2="96"/>
      <text class="s115" x="707" y="114"><tspan class="acc b">1</tspan><tspan x="721">Find the element</tspan></text>
      <text class="s115" x="707" y="131"><tspan class="acc b">2</tspan><tspan x="721">Change it</tspan></text>
      <text class="s115" x="707" y="148"><tspan class="acc b">3</tspan><tspan x="721">Check the result</tspan></text>
      <text class="s115" x="707" y="165"><tspan class="acc b">4</tspan><tspan x="721">Commit and report</tspan></text>
      <text class="small" x="707" y="186">any agent reads it</text>
      <text class="cap" x="770" y="216">The agent follows</text>
      <text class="cap" x="770" y="231">the method</text>

      <!-- 5 Commit -->
      <rect class="card" x="695" y="266" width="150" height="130" rx="6"/>
      <text class="mono m" x="707" y="288">commit a1b2c3</text>
      <line class="rule" x1="707" y1="298" x2="833" y2="298"/>
      <text class="mono" x="707" y="318"><tspan class="warn">−</tspan><tspan x="721">Contact us</tspan></text>
      <text class="mono" x="707" y="336"><tspan class="ok">+</tspan><tspan x="721">Book now</tspan></text>
      <text class="note" x="707" y="362">“Changed the button</text>
      <text class="note" x="707" y="377">text to Book now.”</text>
      <text class="cap" x="770" y="418">It commits and writes</text>
      <text class="cap" x="770" y="433">two or three sentences</text>

      <!-- 6 Ship -->
      <rect class="card" x="475" y="266" width="150" height="130" rx="6"/>
      <text class="small" x="487" y="288">before it ships</text>
      <line class="rule" x1="487" y1="298" x2="613" y2="298"/>
      <circle class="ok" cx="492" cy="314" r="3.5"/><text class="mono" x="502" y="318">files checked</text>
      <circle class="ok" cx="492" cy="334" r="3.5"/><text class="mono" x="502" y="338">pushed</text>
      <circle class="ok" cx="492" cy="354" r="3.5"/><text class="mono" x="502" y="358">host deploys</text>
      <circle class="ok" cx="492" cy="374" r="3.5"/><text class="mono" x="502" y="378">note posted</text>
      <text class="cap" x="550" y="418">Files checked, pushed,</text>
      <text class="cap" x="550" y="433">the host deploys</text>

      <!-- 7 Record -->
      <rect class="card" x="255" y="266" width="150" height="130" rx="6"/>
      <text class="s11" x="267" y="288"><tspan class="acc b">#12</tspan> <tspan class="ok b">Done</tspan></text>
      <line class="rule" x1="267" y1="298" x2="393" y2="298"/>
      <text class="note" x="267" y="318">“Changed the button</text>
      <text class="note" x="267" y="333">text to Book now.”</text>
      <text class="mono m" x="267" y="356">a1b2c3 · live</text>
      <text class="small" x="267" y="384">mail only for questions</text>
      <text class="cap" x="330" y="418">The issue keeps</text>
      <text class="cap" x="330" y="433">the record</text>

      <!-- 8 Show -->
      <rect class="card" x="35" y="266" width="150" height="130" rx="6"/>
      <line class="rule" x1="35" y1="282" x2="185" y2="282"/>
      <circle class="bar" cx="55" cy="274" r="2.2"/><circle class="bar" cx="62" cy="274" r="2.2"/><circle class="bar" cx="69" cy="274" r="2.2"/>
      <rect class="ink" x="47" y="292" width="80" height="8" rx="2"/>
      <rect class="bar" x="47" y="306" width="126" height="4" rx="2"/>
      <rect class="bar" x="47" y="314" width="100" height="4" rx="2"/>
      <rect class="sel" x="43" y="324" width="84" height="26" rx="4"/>
      <rect class="btn" x="47" y="328" width="76" height="18" rx="3"/>
      <text class="btn-t" x="85" y="341">Book now</text>
      <rect class="pill" x="47" y="362" width="126" height="24" rx="12"/>
      <text class="s11" x="59" y="378"><tspan class="b">#12</tspan> <tspan class="ok">Done</tspan> · <tspan class="acc" text-decoration="underline">Show</tspan></text>
      <text class="cap" x="110" y="418">Status and Show come</text>
      <text class="cap" x="110" y="433">back to the page</text>

      <!-- arrows: out along the top, back along the bottom -->
      <line class="arrow" x1="189" y1="129" x2="249" y2="129" marker-end="url(#ah)"/>
      <text class="alabel" x="220" y="121">new issue</text>
      <line class="arrow" x1="409" y1="129" x2="469" y2="129" marker-end="url(#ah)"/>
      <text class="alabel" x="440" y="121">triggers</text>
      <line class="arrow" x1="629" y1="129" x2="689" y2="129" marker-end="url(#ah)"/>
      <text class="alabel" x="660" y="121">runs agent</text>
      <line class="arrow" x1="770" y1="239" x2="770" y2="261" marker-end="url(#ah)"/>
      <text class="alabel start" x="780" y="254">works it</text>
      <line class="arrow" x1="691" y1="331" x2="631" y2="331" marker-end="url(#ah)"/>
      <text class="alabel" x="660" y="323">commit</text>
      <line class="arrow" x1="471" y1="331" x2="411" y2="331" marker-end="url(#ah)"/>
      <text class="alabel" x="440" y="323">posts note</text>
      <line class="arrow" x1="251" y1="331" x2="191" y2="331" marker-end="url(#ah)"/>
      <text class="alabel" x="220" y="323">status</text>
      <line class="arrow dash" x1="110" y1="261" x2="110" y2="239" marker-end="url(#ah)"/>
      <text class="alabel start" x="120" y="254">next comment</text>

      <circle class="badge" cx="35" cy="64" r="10"/><text class="badge-t" x="35" y="68">1</text>
      <circle class="badge" cx="255" cy="64" r="10"/><text class="badge-t" x="255" y="68">2</text>
      <circle class="badge" cx="475" cy="64" r="10"/><text class="badge-t" x="475" y="68">3</text>
      <circle class="badge" cx="695" cy="64" r="10"/><text class="badge-t" x="695" y="68">4</text>
      <circle class="badge" cx="695" cy="266" r="10"/><text class="badge-t" x="695" y="270">5</text>
      <circle class="badge" cx="475" cy="266" r="10"/><text class="badge-t" x="475" y="270">6</text>
      <circle class="badge" cx="255" cy="266" r="10"/><text class="badge-t" x="255" y="270">7</text>
      <circle class="badge" cx="35" cy="266" r="10"/><text class="badge-t" x="35" y="270">8</text>
    </svg>
